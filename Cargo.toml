[package]
name = "si446x"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Driver for Si446x radios"
readme = "README.md"
keywords = ["si446x", "radio", "embedded-hal", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }

[features]
default = []
async = ["dep:embedded-hal-async"]
rev-c2 = []
si4467-68 = ["rev-c2"]
